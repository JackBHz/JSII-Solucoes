<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redes &amp; Cabeamento Estruturado — JSII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: #0e1525;
      --bg-card-hover: #141e33;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --orange: #ff6b00;
      --orange-hover: #e55e00;
      --blue: #2563eb;
      --blue-light: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      background-image:
        linear-gradient(rgba(30, 41, 59, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 41, 59, 0.25) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER / NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .logo {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      line-height: 1.1;
    }

    .logo-title span {
      color: var(--blue-light);
    }

    .logo-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    nav ul a:hover, nav ul a.active {
      color: #fff;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      transition: 0.2s ease;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: #fff;
    }

    .btn-outline:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    .btn-orange {
      background: var(--orange);
      color: #fff;
    }

    .btn-orange:hover {
      background: var(--orange-hover);
      transform: translateY(-1px);
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
    }

    .btn-blue:hover {
      background: #1d4ed8;
    }

    /* HERO DO SERVIÇO */
    .service-hero {
      padding: 56px 0 64px;
      border-bottom: 1px solid var(--border);
    }

    .breadcrumb-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .breadcrumb-link {
      color: var(--text-muted);
      transition: 0.2s;
    }

    .breadcrumb-link:hover {
      color: #fff;
    }

    .service-tag {
      color: var(--blue-light);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 44px;
      align-items: center;
    }

    .service-hero h1 {
      font-size: clamp(2.2rem, 4.5vw, 3.6rem);
      font-weight: 900;
      line-height: 1.08;
      margin-bottom: 20px;
    }

    .service-hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 32px;
      max-width: 580px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-photo {
      min-height: 330px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-image: linear-gradient(to top, rgba(7,11,20,0.6), transparent),
        url('https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=900&q=80');
      background-size: cover;
      background-position: center;
    }

    /* SEÇÕES INTERNAS */
    section.content-sec {
      padding: 64px 0;
      border-bottom: 1px solid var(--border);
    }

    .sec-heading {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 32px;
    }

    /* O QUE ENTREGAMOS */
    .deliverables-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .deliverable-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.96rem;
      font-weight: 500;
      color: #e2e8f0;
      transition: 0.2s;
    }

    .deliverable-item:hover {
      border-color: rgba(56, 189, 248, 0.45);
      background: var(--bg-card-hover);
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--blue-light);
      color: var(--blue-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* COMO EXECUTAMOS (01 - 04) */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .step-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      transition: 0.25s;
    }

    .step-card:hover {
      border-color: var(--blue-light);
      transform: translateY(-3px);
    }

    .step-num {
      font-size: 2.2rem;
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--blue-light);
      display: block;
      margin-bottom: 18px;
      font-family: 'Inter', sans-serif;
    }

    .step-card p {
      font-size: 0.95rem;
      color: #e2e8f0;
      font-weight: 500;
    }

    /* OUTRAS FRENTES */
    .other-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .pill-link {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .pill-link:hover {
      border-color: var(--orange);
      color: var(--orange);
      background: var(--bg-card-hover);
    }

    /* FOOTER */
    footer {
      background: #05080f;
      padding: 60px 0 30px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
      gap: 32px;
      margin-bottom: 40px;
    }

      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font
