<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato &amp; Orçamento — JSII Jack Soluções em Informática e Instalações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: #0e1525;
      --bg-card-hover: #141e33;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --orange: #ff6b00;
      --orange-hover: #e55e00;
      --blue: #2563eb;
      --blue-light: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      background-image: 
        linear-gradient(rgba(30, 41, 59, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 41, 59, 0.25) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER / NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .logo {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }

    .logo-title span {
      color: var(--blue-light);
    }

    .logo-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    nav ul a:hover, nav ul a.active {
      color: #fff;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      transition: 0.2s ease;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: #fff;
    }

    .btn-outline:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
    }

    .btn-blue:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    /* PAGE HERO */
    .contact-hero {
      padding: 64px 0 40px;
    }

    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(14, 21, 37, 0.9);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
